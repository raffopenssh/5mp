<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Globe icon -->
  <g transform="translate(600, 250)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#green)" stroke-width="3" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="40" ry="100" fill="none" stroke="url(#green)" stroke-width="2" opacity="0.6"/>
    <path d="M-100 0 L100 0" stroke="url(#green)" stroke-width="2" opacity="0.6"/>
    <path d="M-85 -50 L85 -50" stroke="url(#green)" stroke-width="1.5" opacity="0.4"/>
    <path d="M-85 50 L85 50" stroke="url(#green)" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Africa outline hint -->
    <path d="M-10 -60 L10 -50 L20 -20 L15 20 L-5 50 L-20 30 L-25 -10 L-15 -40 Z" 
          fill="rgba(34,197,94,0.3)" stroke="#22c55e" stroke-width="1"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="64" font-weight="600" fill="#ffffff">5MP.globe</text>
  
  <!-- Subtitle -->
  <text x="600" y="480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="24" fill="#888888">African Conservation Monitoring</text>
  
  <!-- Stats bar -->
  <g transform="translate(300, 540)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="18" fill="#22c55e">162 Protected Areas</text>
    <text x="250" y="0" font-family="-apple-system, sans-serif" font-size="18" fill="#666666">|</text>
    <text x="300" y="0" font-family="-apple-system, sans-serif" font-size="18" fill="#f97316">Fire Detection</text>
    <text x="480" y="0" font-family="-apple-system, sans-serif" font-size="18" fill="#666666">|</text>
    <text x="530" y="0" font-family="-apple-system, sans-serif" font-size="18" fill="#ef4444">Deforestation</text>
  </g>
</svg>