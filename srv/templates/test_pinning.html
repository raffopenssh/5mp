<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UI Pinning Tests - 5MP Globe</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #121212; color: #ddd; padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { color: #22c55e; }
        .test-frame { width: 100%; height: 500px; border: 1px solid #333; border-radius: 8px; margin: 20px 0; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
        button { padding: 10px 20px; background: #22c55e; color: #000; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        button:hover { background: #16a34a; }
        button.secondary { background: #333; color: #fff; }
        button.secondary:hover { background: #444; }
        .results { background: #1e1e1e; padding: 15px; border-radius: 8px; margin: 20px 0; max-height: 300px; overflow-y: auto; }
        .result-item { padding: 5px 0; border-bottom: 1px solid #333; }
        .result-item.pass { color: #22c55e; }
        .result-item.fail { color: #ef4444; }
        .result-item.skip { color: #f59e0b; }
        .summary { display: flex; gap: 20px; margin: 20px 0; }
        .summary-item { padding: 10px 20px; border-radius: 6px; }
        .summary-item.pass { background: rgba(34,197,94,0.2); }
        .summary-item.fail { background: rgba(239,68,68,0.2); }
        .summary-item.skip { background: rgba(245,158,11,0.2); }
        pre { background: #0a0a0a; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
        .test-parks { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
        .test-park { padding: 5px 10px; background: #333; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .test-park:hover { background: #444; }
        .test-park.active { background: #22c55e; color: #000; }
    </style>
</head>
<body>
    <h1>🧪 UI Pinning Tests</h1>
    <p>Test all popup sections and pinning functionality.</p>
    
    <div class="test-parks">
        <strong>Test Park:</strong>
        <span class="test-park active" data-park="CAF_Chinko" data-name="Chinko">Chinko (CAF)</span>
        <span class="test-park" data-park="TCD_Zakouma" data-name="Zakouma">Zakouma (TCD)</span>
        <span class="test-park" data-park="COD_Virunga" data-name="Virunga">Virunga (COD)</span>
        <span class="test-park" data-park="TZA_Serengeti" data-name="Serengeti">Serengeti (TZA)</span>
    </div>
    
    <div class="controls">
        <button onclick="runAllTests()">▶️ Run All Tests</button>
        <button class="secondary" onclick="testCategoryPins()">Test Category Pins</button>
        <button class="secondary" onclick="testSinglePins()">Test Single Pins</button>
        <button class="secondary" onclick="testTimeFilter()">Test Time Filter</button>
        <button class="secondary" onclick="clearResults()">Clear Results</button>
    </div>
    
    <div class="summary" id="summary" style="display: none;">
        <div class="summary-item pass">✅ Passed: <span id="pass-count">0</span></div>
        <div class="summary-item fail">❌ Failed: <span id="fail-count">0</span></div>
        <div class="summary-item skip">⏭️ Skipped: <span id="skip-count">0</span></div>
    </div>
    
    <div class="results" id="results">
        <em>Click a test button to begin...</em>
    </div>
    
    <iframe id="test-frame" class="test-frame" src="about:blank"></iframe>
    
    <script>
        let testParkId = 'CAF_Chinko';
        let testParkName = 'Chinko';
        let results = { passed: [], failed: [], skipped: [] };
        
        // Park selection
        document.querySelectorAll('.test-park').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelectorAll('.test-park').forEach(p => p.classList.remove('active'));
                el.classList.add('active');
                testParkId = el.dataset.park;
                testParkName = el.dataset.name;
                loadTestFrame();
            });
        });
        
        function loadTestFrame() {
            const frame = document.getElementById('test-frame');
            const pwd = new URLSearchParams(window.location.search).get('pwd') || 'test2026';
            frame.src = `/?pwd=${pwd}&popup=${testParkId}&sections=fire,ghsl,deforest,road`;
        }
        
        function log(msg, type = 'info') {
            const resultsEl = document.getElementById('results');
            const item = document.createElement('div');
            item.className = `result-item ${type}`;
            const prefix = type === 'pass' ? '✅' : type === 'fail' ? '❌' : type === 'skip' ? '⏭️' : 'ℹ️';
            item.textContent = `${prefix} ${msg}`;
            resultsEl.appendChild(item);
            resultsEl.scrollTop = resultsEl.scrollHeight;
        }
        
        function assert(condition, testName) {
            if (condition) {
                results.passed.push(testName);
                log(testName, 'pass');
            } else {
                results.failed.push(testName);
                log(testName, 'fail');
            }
            updateSummary();
            return condition;
        }
        
        function updateSummary() {
            document.getElementById('summary').style.display = 'flex';
            document.getElementById('pass-count').textContent = results.passed.length;
            document.getElementById('fail-count').textContent = results.failed.length;
            document.getElementById('skip-count').textContent = results.skipped.length;
        }
        
        function clearResults() {
            results = { passed: [], failed: [], skipped: [] };
            document.getElementById('results').innerHTML = '<em>Click a test button to begin...</em>';
            document.getElementById('summary').style.display = 'none';
        }
        
        function getFrameWindow() {
            return document.getElementById('test-frame').contentWindow;
        }
        
        async function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        async function runAllTests() {
            clearResults();
            log('Starting all tests for ' + testParkName + '...');
            
            const fw = getFrameWindow();
            if (!fw.document.querySelector('.pa-popup')) {
                log('Waiting for popup to load...');
                await wait(3000);
            }
            
            await testPopup();
            await testFireSection();
            await testFireCategoryPin();
            await testFireNarrativePin();
            await testSettlementSection();
            await testSettlementCategoryPin();
            await testDeforestationSection();
            await testRoadsSection();
            await testClearIndicator();
            
            log('Tests complete!');
        }
        
        async function testPopup() {
            const fw = getFrameWindow();
            const popup = fw.document.querySelector('.pa-popup');
            assert(popup !== null, 'Popup exists');
            
            const name = popup?.querySelector('.pa-popup-name span')?.textContent;
            assert(name === testParkName, `Popup shows "${name}"`);
        }
        
        async function testFireSection() {
            const fw = getFrameWindow();
            const section = fw.document.getElementById(`fire-section-${testParkId}`);
            assert(section !== null, 'Fire section exists');
            
            if (!section?.classList.contains('open')) {
                section?.click();
                await wait(2000);
            }
            
            const content = fw.document.getElementById(`fire-content-${testParkId}`);
            assert(content && content.innerHTML.length > 100, 'Fire content loaded');
            
            const rows = content?.querySelectorAll('.narrative-row');
            assert(rows && rows.length > 0, `Fire narratives: ${rows?.length || 0}`);
        }
        
        async function testFireCategoryPin() {
            const fw = getFrameWindow();
            const icon = fw.document.querySelector(`[data-park-id="${testParkId}"][data-type="fire"]`);
            assert(icon !== null, 'Fire pin icon exists');
            
            icon?.click();
            await wait(2000);
            
            assert(icon?.classList.contains('pinned'), 'Fire icon shows pinned');
            
            const indicator = fw.document.querySelector('.pinned-indicator');
            assert(indicator?.classList.contains('active'), 'Indicator active');
            
            // Unpin
            icon?.click();
            await wait(500);
        }
        
        async function testFireNarrativePin() {
            const fw = getFrameWindow();
            const row = fw.document.querySelector(`#fire-content-${testParkId} .narrative-row`);
            assert(row !== null, 'Fire narrative row exists');
            
            row?.click();
            await wait(2000);
            
            assert(row?.classList.contains('pinned'), 'Narrative row pinned');
            
            row?.click();
            await wait(500);
        }
        
        async function testCategoryPins() {
            clearResults();
            log('Testing category pins...');
            
            const fw = getFrameWindow();
            const types = ['fire', 'settlement', 'deforestation', 'road'];
            
            for (const type of types) {
                const icon = fw.document.querySelector(`[data-park-id="${testParkId}"][data-type="${type}"]`);
                if (!icon) {
                    results.skipped.push(`${type} icon`);
                    log(`${type} icon not found`, 'skip');
                    continue;
                }
                
                icon.click();
                await wait(2000);
                
                assert(icon.classList.contains('pinned'), `${type} category pin`);
                
                icon.click();
                await wait(500);
            }
            
            updateSummary();
        }
        
        async function testSinglePins() {
            clearResults();
            log('Testing single feature pins...');
            
            const fw = getFrameWindow();
            
            // Open sections
            ['fire', 'ghsl', 'deforest'].forEach(s => {
                const section = fw.document.getElementById(`${s}-section-${testParkId}`);
                if (section && !section.classList.contains('open')) section.click();
            });
            await wait(2000);
            
            const rows = fw.document.querySelectorAll('.narrative-row');
            log(`Found ${rows.length} narrative rows`);
            
            for (let i = 0; i < Math.min(3, rows.length); i++) {
                rows[i].click();
                await wait(1500);
                assert(rows[i].classList.contains('pinned'), `Row ${i+1} pinned`);
                rows[i].click();
                await wait(500);
            }
            
            updateSummary();
        }
        
        async function testSettlementSection() {
            const fw = getFrameWindow();
            const section = fw.document.getElementById(`ghsl-section-${testParkId}`);
            if (!section) {
                results.skipped.push('Settlement section');
                log('Settlement section not found', 'skip');
                return;
            }
            
            if (!section.classList.contains('open')) {
                section.click();
                await wait(2000);
            }
            
            const content = fw.document.getElementById(`ghsl-content-${testParkId}`);
            assert(content && content.innerHTML.length > 50, 'Settlement content loaded');
        }
        
        async function testSettlementCategoryPin() {
            const fw = getFrameWindow();
            const icon = fw.document.querySelector(`[data-park-id="${testParkId}"][data-type="settlement"]`);
            if (!icon) {
                results.skipped.push('Settlement pin');
                log('Settlement icon not found', 'skip');
                return;
            }
            
            icon.click();
            await wait(2000);
            assert(icon.classList.contains('pinned'), 'Settlement category pin');
            icon.click();
            await wait(500);
        }
        
        async function testDeforestationSection() {
            const fw = getFrameWindow();
            const section = fw.document.getElementById(`deforest-section-${testParkId}`);
            if (!section) {
                results.skipped.push('Deforestation section');
                log('Deforestation section not found', 'skip');
                return;
            }
            
            if (!section.classList.contains('open')) {
                section.click();
                await wait(2000);
            }
            
            const content = fw.document.getElementById(`deforest-content-${testParkId}`);
            assert(content && content.innerHTML.length > 50, 'Deforestation content loaded');
        }
        
        async function testRoadsSection() {
            const fw = getFrameWindow();
            const section = fw.document.getElementById(`road-section-${testParkId}`);
            if (!section) {
                results.skipped.push('Roads section');
                log('Roads section not found', 'skip');
                return;
            }
            
            if (!section.classList.contains('open')) {
                section.click();
                await wait(2000);
            }
            
            const content = fw.document.getElementById(`road-content-${testParkId}`);
            assert(content && content.innerHTML.length > 50, 'Roads content loaded');
        }
        
        async function testClearIndicator() {
            const fw = getFrameWindow();
            
            // Pin something first
            const icon = fw.document.querySelector(`[data-park-id="${testParkId}"][data-type="fire"]`);
            icon?.click();
            await wait(2000);
            
            const indicator = fw.document.querySelector('.pinned-indicator');
            if (indicator?.classList.contains('active')) {
                indicator.click();
                await wait(1000);
                assert(!indicator.classList.contains('active'), 'Indicator cleared on click');
            }
        }
        
        async function testTimeFilter() {
            clearResults();
            log('Testing time filter...');
            
            const fw = getFrameWindow();
            
            if (typeof fw.setTimeSliderRange === 'function') {
                const before = fw.document.querySelector(`#fire-count-${testParkId}`)?.textContent;
                
                fw.setTimeSliderRange('2024-01-01', '2024-06-01');
                await wait(3000);
                
                const after = fw.document.querySelector(`#fire-count-${testParkId}`)?.textContent;
                log(`Fire count: ${before} -> ${after}`);
                assert(true, 'Time filter applied');
            } else {
                results.skipped.push('Time filter');
                log('setTimeSliderRange not available', 'skip');
            }
            
            updateSummary();
        }
        
        // Load frame on page load
        loadTestFrame();
    </script>
</body>
</html>
